name: Debt Market Update

on:
  schedule:
    # Morning runs: pick up FRED's next-day ICE BofA OAS data (posted by ~10 AM Central)
    - cron: '17 16 * * 1-5'   # 16:17 UTC = 11:17 AM CDT / 10:17 AM CST
    - cron: '47 17 * * 1-5'   # 17:47 UTC = backup in case FRED posts late
    # Evening run: same-day MOVE/HYG (Yahoo) and Treasury yields
    - cron: '23 22 * * 1-5'   # 22:23 UTC = 5:23 PM CDT / 4:23 PM CST
  workflow_dispatch: {}        # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: debt-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance fredapi pandas numpy python-dateutil

      - name: Run debt market script
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: python scripts/debt_market.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debt_market.json debt_series.csv
          git commit -m "Debt market update $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git pull --rebase
          git push
